[package]
name = "ssc-engine"
version = "0.1.0"
edition = "2021"
description = "SuperSpellCheck core engine: context-aware spelling and grammar checking"
license = "UNLICENSED"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ssc"
path = "src/bin/ssc.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }
